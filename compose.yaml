services:
  postgres:
    image: postgres:17-alpine
    container_name: fx-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fx
      POSTGRES_PASSWORD: fx
      POSTGRES_DB: fx_api
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fx -d fx_api']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
